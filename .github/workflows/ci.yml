name: CI

# PR と push で検査とビルドを回す。デプロイはしない（公開を止めている）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # このジョブ名がブランチ保護の必須チェック名になる。変えるときは設定も直すこと
    name: check & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 型チェック・lint・配色の検査
        run: pnpm check
      - name: ビルド
        run: pnpm build
